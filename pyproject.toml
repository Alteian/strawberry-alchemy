[project]
name = "strawberry-alchemy"
version = "0.2.3"
description = "Toolkit for fast and easy strawberry+sqlalchemy apis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "David Roučka", email = "Alteian@proton.me" },
]
keywords = ["graphql", "strawberry", "sqlalchemy", "async", "api", "pagination", "relay", "filtering", "permissions", "crud", "database"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "strawberry-graphql>=0.339.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "pydantic>=2.14.2",
    "python-dateutil>=4.0",
]

[project.urls]
Homepage = "https://github.com/Alteian/strawberry-alchemy"
Repository = "https://github.com/Alteian/strawberry-alchemy"
Issues = "https://github.com/Alteian/strawberry-alchemy/issues"
Changelog = "https://github.com/Alteian/strawberry-alchemy/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=6.0",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "aiosqlite>=0.22",
    "pre-commit>=4.7",
    "types-python-dateutil>=2.9",
]

[build-system]
requires = ["uv_build>=0.11.21"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/strawberry_alchemy/repository/base.py" = ["A002"]
"examples/**" = ["A002", "TC001", "TC002", "TC003"]
"tests/examples/**" = ["A002"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["strawberry_alchemy"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["strawberry.ext.mypy_plugin"]
