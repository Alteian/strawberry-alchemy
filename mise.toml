# Toolchain pins shared by local dev and CI (via jdx/mise-action).
# Tasks stay in the Makefile — mise only manages tool versions.
# Both Python minors are locked so the CI matrix (3.13 / 3.14) works with --locked.

[tools]
python = ["3.13", "3.14"]
uv = "0.13.6"

[settings]
idiomatic_version_file_enable_tools = ["python"]
python.uv_venv_auto = "source"
