# Toolchain pins shared by local dev and CI (via jdx/mise-action).
# Tasks stay in the Makefile — mise only manages tool versions.
# Exact patch versions so CI matrix + `mise install --locked` stay aligned.

[tools]
python = ["3.13.18", "3.14.8"]
uv = "0.13.6"

[settings]
idiomatic_version_file_enable_tools = ["python"]
python.uv_venv_auto = "source"
