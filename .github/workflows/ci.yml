name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ">=0.9"
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ">=0.9"
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --frozen
      - run: uv run mypy src/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ">=0.9"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - run: uv sync --frozen
      - run: uv run pytest -v --cov=strawberry_alchemy --cov-report=term-missing --cov-fail-under=68 -m "not postgres"

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: strawberry_alchemy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STRAWBERRY_ALCHEMY_PG_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/strawberry_alchemy

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ">=0.9"
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --frozen
      - run: uv run pytest -v -m postgres

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, postgres]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ">=0.9"
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --frozen
      - run: uv build
